<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luciano Puentes - Plataforma Laboral SENCE</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a0f1a, #0d1b2a 40%, #1b263b 80%);
            background-attachment: fixed;
            color: white;
            text-align: center;
        }

        /* --- TARJETA SUPERIOR AZUL GEOMÉTRICA --- */
        .header-box {
            width: 100%;
            padding: 35px 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(0,0,0,0.1)),
                        linear-gradient(45deg, rgba(0,150,255,0.4), rgba(0,0,80,0.5));
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
            margin-bottom: 20px;
        }

        .header-box h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #3aa6ff;
            margin: 0;
        }

        .header-box h2 {
            font-size: 15px;
            margin-top: 8px;
            color: #e5edf7;
            font-weight: 300;
        }

        /* CONTENEDOR CENTRAL */
        .container {
            width: 90%;
            max-width: 350px;
            margin: 0 auto;
            margin-top: 10px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        /* FOTO PERFIL */
        img.foto {
            width: 100%;
            border-radius: 50%;
            border: 5px solid rgba(255,255,255,0.2);
        }

        /* --- BOTONES NUEVO ESTILO GRIS ELEGANTE --- */
        .btn {
            display: block;
            background: #2b2f36;
            color: #ffffff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            border: 1px solid #40444b;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #3a3f47;
            border-color: #4d525a;
        }

        .section-link {
            text-align: center;
            margin-top: 35px;
        }

        .section-link a {
            background: #2e3340;
            padding: 12px 20px;
            border-radius: 8px;
            display: inline-block;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border: 1px solid #444a55;
        }

        .section-link a:hover {
            background: #3a404d;
            border-color: #555b66;
        }
    </style>

</head>
<body>

    <!-- TARJETA SUPERIOR -->
    <div class="header-box">
        <h1>LUCIANO PUENTES</h1>
        <h2>Ejecutivo de Empresas Plataforma Laboral SENCE</h2>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container">
        <img src="foto.png" class="foto" alt="Foto de perfil">

        <a class="btn" href="https://wa.me/56949934830" target="_blank">WhatsApp</a>
        <a class="btn" href="mailto:lpuentes@sence.cl">Email</a>
        <a class="btn" href="https://www.linkedin.com/in/lpuentes-sence" target="_blank">LinkedIn</a>
    </div>

    <!-- ENLACE SENCE -->
    <div class="section-link">
        <h3>Conoce más sobre Plataforma Laboral</h3>
        <a href="https://sence.gob.cl/personas/plataformas-laborales" target="_blank">
            Ir al sitio web
        </a>
    </div>

</body>
</html>
